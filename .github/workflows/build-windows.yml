name: Build Windows exe

# Builds a real Windows executable for Hextra on a Windows runner, smoke tests it
# headlessly, and publishes it as a workflow artifact (plus a GitHub Release on tags).
#
# Triggered by:
#   * a pull request            -> artifacts are attached to the PR checks
#   * a push to master          -> artifacts for the current mainline
#   * a v* tag                  -> artifacts + a GitHub Release with both exes
#   * "Run workflow" in Actions -> on demand

on:
  pull_request:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-exe-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  pyinstaller:
    name: PyInstaller (one-file exe)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Show toolchain
        run: |
          python -c "import sys, PyQt6.QtCore, psutil; print('Python', sys.version.split()[0]); print('Qt', PyQt6.QtCore.QT_VERSION_STR); print('psutil', psutil.__version__)"
          python -m PyInstaller --version

      - name: Build exe
        run: python -m PyInstaller --noconfirm --clean packaging/hextra.spec

      - name: Smoke test the exe
        shell: pwsh
        run: pwsh -NoProfile -File packaging/smoke_test.ps1 -Exe dist/Hextra.exe

      - name: Stage artifact
        shell: pwsh
        run: pwsh -NoProfile -File packaging/stage_artifact.ps1 -Exe dist/Hextra.exe -OutDir artifact -Backend pyinstaller

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: Hextra-windows-x64-pyinstaller
          path: artifact/
          if-no-files-found: error
          retention-days: 30

      - name: Upload crash log on failure
        if: failure()
        shell: pwsh
        run: |
          $log = Join-Path $env:TEMP 'hextra_crash.log'
          if (Test-Path $log) { Get-Content $log | Out-Host; Copy-Item $log artifact/hextra_crash.log -Force }
        continue-on-error: true

  nuitka:
    name: Nuitka (compiled exe)
    runs-on: windows-latest
    timeout-minutes: 90
    # The documented Nuitka path is slower and toolchain sensitive; never let it
    # block delivery of the PyInstaller exe.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt
          python -m nuitka --version

      - name: Build exe with build_hextra_nuitka.bat
        shell: cmd
        env:
          HEXTRA_SKIP_PIP: "1"
        run: build_hextra_nuitka.bat

      - name: Smoke test the exe
        shell: pwsh
        run: pwsh -NoProfile -File packaging/smoke_test.ps1 -Exe dist-nuitka/Hextra.exe -TimeoutSeconds 240

      - name: Stage artifact
        shell: pwsh
        run: pwsh -NoProfile -File packaging/stage_artifact.ps1 -Exe dist-nuitka/Hextra.exe -OutDir artifact -Backend nuitka

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: Hextra-windows-x64-nuitka
          path: artifact/
          if-no-files-found: error
          retention-days: 30

      - name: Report soft failure
        if: failure()
        run: |
          echo "The Nuitka build failed, but the PyInstaller job still produced a working exe." >> "$GITHUB_STEP_SUMMARY"
        shell: bash

  release:
    name: Publish release
    if: github.ref_type == 'tag'
    needs: [pyinstaller, nuitka]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: Hextra-windows-x64-*
          path: release
          merge-multiple: true

      - name: Combined checksums
        run: |
          cd release
          rm -f SHA256SUMS.txt
          sha256sum ./*.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" release/* \
            --title "Hextra $TAG" \
            --generate-release-notes \
            --notes "Windows x64 executables built by the \`Build Windows exe\` workflow.
          \`-nuitka\` is the compiled Nuitka build; the other file is the PyInstaller bundle.
          Both are unsigned, so SmartScreen will warn on first run."
